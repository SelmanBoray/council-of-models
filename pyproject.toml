[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "council-of-models"
dynamic = ["version"]
description = "Ask a council of LLMs: members answer, anonymously rank each other, a chairman synthesizes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Selman Boray Asilturk" }]
keywords = ["llm", "council", "evaluation", "llm-as-judge", "openrouter", "anthropic", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "anthropic>=1.12,<2",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
mcp = ["mcp>=1.2,<2"]  # contract uses FastMCP; mcp 2.x renamed it to MCPServer
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.22", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/SelmanBoray/council-of-models"
Issues = "https://github.com/SelmanBoray/council-of-models/issues"

[project.scripts]
council = "council.cli:app"
council-mcp = "council.mcp_server:main"

[tool.hatch.version]
path = "src/council/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/council"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
